<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Metro 线网工坊 标志">
    <!-- 硬投影 -->
    <rect x="48" y="48" width="404" height="404" rx="12" fill="#000000" />
    <!-- 主底 -->
    <rect x="28" y="28" width="404" height="404" rx="12" fill="#8b5cf6" stroke="#000000" stroke-width="18" />
    <!-- 角部色块 -->
    <rect x="392" y="64" width="26" height="26" fill="#10b981" stroke="#000000" stroke-width="7" />
    <rect x="66" y="390" width="26" height="26" fill="#f59e0b" stroke="#000000" stroke-width="7" />
    <!-- 白色图面 -->
    <rect x="96" y="96" width="268" height="268" rx="8" fill="#ffffff" stroke="#000000" stroke-width="12" />
    <!-- 线路：绿线 45 度折线 -->
    <path d="M132 328 L196 264 L300 264 L332 232" fill="none" stroke="#10b981" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round" />
    <!-- 线路：黄线（白色描边保证与绿线交叉处留白） -->
    <path d="M132 200 L204 200 L300 296 L332 296" fill="none" stroke="#ffffff" stroke-width="38"
        stroke-linecap="round" stroke-linejoin="round" />
    <path d="M132 200 L204 200 L300 296 L332 296" fill="none" stroke="#f59e0b" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round" />
    <!-- 普通车站 -->
    <circle cx="132" cy="328" r="11" fill="#ffffff" stroke="#000000" stroke-width="7" />
    <circle cx="196" cy="264" r="11" fill="#ffffff" stroke="#000000" stroke-width="7" />
    <circle cx="300" cy="264" r="11" fill="#ffffff" stroke="#000000" stroke-width="7" />
    <circle cx="332" cy="232" r="11" fill="#ffffff" stroke="#000000" stroke-width="7" />
    <circle cx="132" cy="200" r="11" fill="#ffffff" stroke="#000000" stroke-width="7" />
    <circle cx="204" cy="200" r="11" fill="#ffffff" stroke="#000000" stroke-width="7" />
    <circle cx="300" cy="296" r="11" fill="#ffffff" stroke="#000000" stroke-width="7" />
    <circle cx="332" cy="296" r="11" fill="#ffffff" stroke="#000000" stroke-width="7" />
    <!-- 换乘站 -->
    <circle cx="268" cy="264" r="24" fill="#ffffff" stroke="#000000" stroke-width="9" />
    <circle cx="268" cy="264" r="7" fill="#ffffff" stroke="#000000" stroke-width="6" />
</svg>
